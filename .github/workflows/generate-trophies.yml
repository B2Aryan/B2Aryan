name: Generate GitHub Trophies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write

jobs:
  generate-trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate trophy SVG
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: "username=B2Aryan&theme=tokyonight&no-frame=true&no-bg=true&column=6&margin-w=12&margin-h=12"
          path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify trophy file
        run: |
          echo "Checking trophy.svg..."
          ls -lh profile/trophy.svg
          head -c 100 profile/trophy.svg

      - name: Commit trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/trophy.svg

          git diff --cached --quiet || git commit -m "Update GitHub trophies"

          git push
